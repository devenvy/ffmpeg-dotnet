name: Build FFmpeg (reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ffmpeg_version:
        required: true
        type: string
      package_version:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      autogen_version:
        required: false
        type: string
        default: ""

env:
  DOTNET_NOLOGO: true
  PACKAGE_PROJECT: src/Binaries.LGPL/Binaries.LGPL.csproj

jobs:
  build-win-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install mingw-w64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake git mingw-w64 nasm ninja-build pkg-config curl xz-utils yasm
      - name: Build FFmpeg for Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/win-x64/logs
          {
            echo "gcc: $(x86_64-w64-mingw32-gcc --version | head -1)"
            echo "g++: $(x86_64-w64-mingw32-g++ --version | head -1)"
            echo "pkg-config: $(pkg-config --version)"
          } > artifacts/win-x64/logs/toolchain.txt
          chmod +x scripts/build-ffmpeg-win64.sh
          FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            ./scripts/build-ffmpeg-win64.sh 2>&1 | tee artifacts/win-x64/logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64-native
          path: artifacts/win-x64/native
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-x64-diagnostics
          path: |
            artifacts/win-x64/build-info.txt
            artifacts/win-x64/logs/build.log
            artifacts/win-x64/logs/toolchain.txt
            .build/win-x64/src/ffbuild/config.log
            .build/win-x64/src/ffbuild/config.mak
            .build/win-x64/src/config.h
          if-no-files-found: warn

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build FFmpeg for Linux (glibc)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux-x64/logs
          {
            echo "gcc: $(gcc --version | head -1)"
            echo "pkg-config: $(pkg-config --version)"
          } > artifacts/linux-x64/logs/toolchain.txt
          chmod +x scripts/build-ffmpeg-linux-gnu.sh
          FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            ./scripts/build-ffmpeg-linux-gnu.sh 2>&1 | tee artifacts/linux-x64/logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-native
          path: artifacts/linux-x64/native
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-diagnostics
          path: |
            artifacts/linux-x64/build-info.txt
            artifacts/linux-x64/logs/build.log
            artifacts/linux-x64/logs/toolchain.txt
            .build/linux-x64/src/ffbuild/config.log
            .build/linux-x64/src/ffbuild/config.mak
            .build/linux-x64/src/config.h
          if-no-files-found: warn

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build FFmpeg for Linux ARM64 (glibc)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux-arm64/logs
          {
            echo "gcc: $(gcc --version | head -1)"
            echo "pkg-config: $(pkg-config --version)"
          } > artifacts/linux-arm64/logs/toolchain.txt
          chmod +x scripts/build-ffmpeg-linux-gnu-arm64.sh
          FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            ./scripts/build-ffmpeg-linux-gnu-arm64.sh 2>&1 | tee artifacts/linux-arm64/logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-native
          path: artifacts/linux-arm64/native
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-arm64-diagnostics
          path: |
            artifacts/linux-arm64/build-info.txt
            artifacts/linux-arm64/logs/build.log
            artifacts/linux-arm64/logs/toolchain.txt
            .build/linux-arm64/src/ffbuild/config.log
            .build/linux-arm64/src/ffbuild/config.mak
            .build/linux-arm64/src/config.h
          if-no-files-found: warn

  build-linux-musl-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install musl cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git musl-tools nasm pkg-config curl xz-utils yasm
      - name: Build FFmpeg for Linux (musl)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux-musl-x64/logs
          {
            echo "musl-gcc: $(musl-gcc --version | head -1)"
            echo "pkg-config: $(pkg-config --version)"
          } > artifacts/linux-musl-x64/logs/toolchain.txt
          chmod +x scripts/build-ffmpeg-linux-musl.sh
          FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            ./scripts/build-ffmpeg-linux-musl.sh 2>&1 | tee artifacts/linux-musl-x64/logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: linux-musl-x64-native
          path: artifacts/linux-musl-x64/native
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-musl-x64-diagnostics
          path: |
            artifacts/linux-musl-x64/build-info.txt
            artifacts/linux-musl-x64/logs/build.log
            artifacts/linux-musl-x64/logs/toolchain.txt
            .build/linux-musl-x64/src/ffbuild/config.log
            .build/linux-musl-x64/src/ffbuild/config.mak
            .build/linux-musl-x64/src/config.h
          if-no-files-found: warn

  build-osx-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build FFmpeg for macOS x64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/osx-x64/logs
          {
            echo "clang: $(clang --version | head -1)"
            echo "pkg-config: $(pkg-config --version)"
          } > artifacts/osx-x64/logs/toolchain.txt
          chmod +x scripts/build-ffmpeg-osx.sh
          FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            RID=osx-x64 \
            ./scripts/build-ffmpeg-osx.sh 2>&1 | tee artifacts/osx-x64/logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: osx-x64-native
          path: artifacts/osx-x64/native
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osx-x64-diagnostics
          path: |
            artifacts/osx-x64/build-info.txt
            artifacts/osx-x64/logs/build.log
            artifacts/osx-x64/logs/toolchain.txt
            .build/osx-x64/src/ffbuild/config.log
            .build/osx-x64/src/ffbuild/config.mak
            .build/osx-x64/src/config.h
          if-no-files-found: warn

  build-osx-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build FFmpeg for macOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/osx-arm64/logs
          {
            echo "clang: $(clang --version | head -1)"
            echo "pkg-config: $(pkg-config --version)"
          } > artifacts/osx-arm64/logs/toolchain.txt
          chmod +x scripts/build-ffmpeg-osx.sh
          FFMPEG_VERSION="${{ inputs.ffmpeg_version }}" \
            RID=osx-arm64 \
            ./scripts/build-ffmpeg-osx.sh 2>&1 | tee artifacts/osx-arm64/logs/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: osx-arm64-native
          path: artifacts/osx-arm64/native
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osx-arm64-diagnostics
          path: |
            artifacts/osx-arm64/build-info.txt
            artifacts/osx-arm64/logs/build.log
            artifacts/osx-arm64/logs/toolchain.txt
            .build/osx-arm64/src/ffbuild/config.log
            .build/osx-arm64/src/ffbuild/config.mak
            .build/osx-arm64/src/config.h
          if-no-files-found: warn

  pack:
    runs-on: ubuntu-latest
    needs:
      - build-win-x64
      - build-linux-x64
      - build-linux-arm64
      - build-linux-musl-x64
      - build-osx-x64
      - build-osx-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/download-artifact@v4
        with:
          name: win-x64-native
          path: src/Binaries.LGPL/ffmpeg/win-x64

      - uses: actions/download-artifact@v4
        with:
          name: linux-x64-native
          path: src/Binaries.LGPL/ffmpeg/linux-x64

      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64-native
          path: src/Binaries.LGPL/ffmpeg/linux-arm64

      - uses: actions/download-artifact@v4
        with:
          name: linux-musl-x64-native
          path: src/Binaries.LGPL/ffmpeg/linux-musl-x64

      - uses: actions/download-artifact@v4
        with:
          name: osx-x64-native
          path: src/Binaries.LGPL/ffmpeg/osx-x64

      - uses: actions/download-artifact@v4
        with:
          name: osx-arm64-native
          path: src/Binaries.LGPL/ffmpeg/osx-arm64

      - name: Resolve AutoGen version
        id: autogen
        run: |
          if [[ -n "${{ inputs.autogen_version }}" ]]; then
            echo "version=${{ inputs.autogen_version }}" >> "$GITHUB_OUTPUT"
          else
            FFMPEG_SERIES="${{ inputs.ffmpeg_version }}"
            FFMPEG_SERIES="${FFMPEG_SERIES%.*}"
            RESOLVED=$(curl -s "https://api.nuget.org/v3-flatcontainer/ffmpeg.autogen.bindings.dynamicallyloaded/index.json" \
              | jq -r '.versions[]' \
              | grep "^${FFMPEG_SERIES}\." \
              | sort -V \
              | tail -1)
            if [[ -n "$RESOLVED" ]]; then
              echo "version=${RESOLVED}" >> "$GITHUB_OUTPUT"
            else
              echo "No AutoGen version found for series ${FFMPEG_SERIES}, using csproj default"
              echo "version=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Pack NuGet
        run: |
          VERSION="${{ inputs.package_version }}"
          ASSEMBLY_VERSION="${VERSION%%.*}.0.0.0"
          AUTOGEN_FLAG=""
          if [[ -n "${{ steps.autogen.outputs.version }}" ]]; then
            AUTOGEN_FLAG="-p:FFmpegAutoGenVersion=${{ steps.autogen.outputs.version }}"
          fi
          dotnet pack "$PACKAGE_PROJECT" \
            -c Release \
            -p:Version="$VERSION" \
            -p:PackageVersion="$VERSION" \
            -p:AssemblyVersion="$ASSEMBLY_VERSION" \
            $AUTOGEN_FLAG \
            -o out

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: out/*.nupkg
          if-no-files-found: error
