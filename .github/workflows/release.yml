name: Release

# Not triggered by a tag: this workflow CREATES the release tag, and a workflow
# cannot be started by a tag it pushes itself. It runs on a merge to main that
# touches the version manifest or the packaging, and can be run by hand.
on:
  push:
    branches: [main]
    paths:
      - versions.json
      - src/**
      - scripts/**
  workflow_dispatch:
    inputs:
      series:
        description: "Series to release (e.g. 9.0). Empty releases every series whose version is not yet tagged."
        required: false
        type: string
      force_rebuild:
        description: "Re-release an upstream build that has already shipped, as a packaging-only rebuild (our_build + 1)."
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Pack and verify everything, then report what WOULD be pushed and tagged. Publishes nothing."
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write   # NuGet trusted publishing (OIDC)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan releases
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Idempotent by design: a series is released when its computed version has
      # no v* tag yet. Re-running after a partial failure resumes rather than
      # duplicating, and a no-op merge releases nothing.
      - id: plan
        env:
          FORCE: ${{ inputs.force_rebuild && '1' || '' }}
        run: |
          set -euo pipefail
          entries=()
          if [[ -n "${FORCE}" && -z "${{ inputs.series }}" ]]; then
            echo "::error::force_rebuild requires an explicit series. Rebuilding every"
            echo "::error::tracked series at once would burn a version number for each."
            exit 1
          fi

          for series in $(jq -r '.series | keys[]' versions.json); do
            if [[ -n "${{ inputs.series }}" && "${series}" != "${{ inputs.series }}" ]]; then
              continue
            fi
            tag=$(jq -r --arg s "$series" '.series[$s]' versions.json)

            # compute-version.sh exits 3 when this upstream build has already
            # shipped. That is the real idempotency check: it cannot be done by
            # asking whether the computed version is tagged, because the script
            # always returns an untagged version by construction.
            set +e
            version=$(bash scripts/compute-version.sh "$tag" ${FORCE:+--force-rebuild} 2>/tmp/cv.err)
            rc=$?
            set -e
            case "${rc}" in
              0) echo "${series}: will release ${version} from upstream ${tag}" ;;
              3) echo "${series}: upstream ${tag} already released, skipping"; continue ;;
              *) echo "::error::compute-version failed for ${series} (${tag}), exit ${rc}"
                 cat /tmp/cv.err >&2
                 exit "${rc}" ;;
            esac
            entries+=("{\"series\":\"${series}\",\"upstream\":\"${tag}\",\"version\":\"${version}\"}")
          done
          if [[ ${#entries[@]} -eq 0 ]]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf 'matrix={"include":[%s]}\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack base packages
        run: bash scripts/pack.sh "${{ matrix.upstream }}" "${{ matrix.version }}" --output ./nupkgs --phase base

      - name: Pack meta packages
        run: bash scripts/pack.sh "${{ matrix.upstream }}" "${{ matrix.version }}" --output ./nupkgs --phase meta

      # Three gates, cheapest first. Structure, then a real restore/build, then
      # actually loading a library and running ffmpeg. The cross-platform smoke
      # matrix runs on the PR; this repeats the host leg here so a release can
      # never publish binaries that do not execute, even on a direct push.
      - name: Verify package structure
        run: bash scripts/verify-packages.sh ./nupkgs

      - name: Verify a consumer can restore and build
        run: bash scripts/verify-consumer.sh ./nupkgs "${{ matrix.version }}"

      - name: Verify the binaries actually run
        env:
          PKG_VERSION: ${{ matrix.version }}
        run: bash scripts/run-smoke-test.sh linux-x64 ./nupkgs

      # A dry run still packs and verifies everything above - the point is to
      # exercise the release path, not to skip it. Only the mutating steps are
      # gated, so the first real release is not also the first execution.
      - name: Report what a dry run would publish
        if: inputs.dry_run
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          echo "DRY RUN - nothing will be pushed or tagged."
          echo
          echo "would push, in this order:"
          echo "  phase 1 (payloads + helper):"
          for f in nupkgs/*.nupkg; do
            case "$(basename "$f")" in *.Runtime.All.[0-9]*) continue ;; esac
            echo "    $(basename "$f")  [$(du -h "$f" | cut -f1)]"
          done
          echo "  phase 2 (metas, after the feed indexes phase 1):"
          for f in nupkgs/*.Runtime.All.[0-9]*.nupkg; do
            [ -e "$f" ] || continue
            echo "    $(basename "$f")"
          done
          echo
          echo "would tag:    v${{ matrix.version }}"
          echo "would create: release v${{ matrix.version }} from upstream ${{ matrix.upstream }}"
          if [ -n "${NUGET_USER}" ]; then
            echo "NUGET_USER: present (publishing uses OIDC trusted publishing)"
          else
            echo "NUGET_USER: MISSING - NuGet/login would fail at the push step"
          fi

      # A trusted-publishing key is short-lived, so it is minted immediately
      # before each push rather than once for the whole job.
      - name: NuGet login (OIDC)
        if: ${{ !inputs.dry_run }}
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push base packages
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for f in nupkgs/*.nupkg; do
            case "$(basename "$f")" in
              *.Runtime.All.[0-9]*) continue ;;   # metas go in the second pass
            esac
            dotnet nuget push "$f" --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      # The metas depend on the payloads by exact version, so a consumer that
      # resolves one before the feed has indexed them gets an unresolvable
      # graph. Wait for the feed to actually serve them rather than assuming.
      - name: Wait for the feed to index the payload packages
        if: ${{ !inputs.dry_run }}
        run: bash scripts/wait-for-index.sh "${{ matrix.version }}" ./nupkgs

      - name: NuGet login (OIDC, refreshed after the indexing wait)
        if: ${{ !inputs.dry_run }}
        id: login_meta
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push meta packages
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_KEY: ${{ steps.login_meta.outputs.NUGET_API_KEY }}
        run: |
          for f in nupkgs/*.Runtime.All.[0-9]*.nupkg; do
            [[ -e "$f" ]] || continue
            dotnet nuget push "$f" --api-key "$NUGET_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Tag and create release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ matrix.version }}"
          git push origin "v${{ matrix.version }}"
          gh release create "v${{ matrix.version }}" \
            --title "v${{ matrix.version }}" \
            --notes "FFmpeg ${{ matrix.upstream }} repackaged from [devenvy/ffmpeg](https://github.com/devenvy/ffmpeg/releases/tag/${{ matrix.upstream }})."
