name: Check for new FFmpeg releases

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-updates
  cancel-in-progress: true

jobs:
  check:
    name: Detect upstream releases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Upstream publishes several series in parallel and marks only one
      # "latest", so releases/latest is never consulted: it points at whichever
      # series published most recently and would silently abandon the others.
      - name: Open one PR for every series that moved
        env:
          GH_TOKEN: ${{ github.token }}
          # Always update the repository's default branch. workflow_dispatch
          # can be launched from any ref, including the rolling head branch.
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          # A single rolling branch rather than one per version. It is rebuilt
          # from the base branch on every run, so a merge of one series can
          # never leave another series' PR conflicting.
          BRANCH: auto/ffmpeg-updates
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          UPSTREAM=$(gh release list --repo devenvy/ffmpeg --limit 100 \
            --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName')

          # Every series that moves is applied to one working copy and
          # described in one list, so N series still yield one commit and one
          # PR rather than N of each.
          work=$(mktemp)
          cp versions.json "${work}"
          moved=()
          bullets=()
          missing=()

          # shellcheck disable=SC2016  # jq program, not a shell expansion
          for series in $(jq -r '.series | keys[]' versions.json); do
            # shellcheck disable=SC2016
            current=$(jq -r --arg s "$series" '.series[$s]' versions.json)

            # Exact field comparison rather than a regex built by bash pattern
            # substitution: ${series//./\.} does not actually escape the dots,
            # leaving separators as wildcards that can match another series.
            latest=$(echo "${UPSTREAM}" \
              | awk -F. -v s="${series}" 'NF == 4 && $1 "." $2 == s && $0 ~ /^[0-9.]+$/' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 || true)

            if [[ -z "${latest}" ]]; then
              missing+=("${series}")
              continue
            fi
            if [[ "${latest}" == "${current}" ]]; then
              echo "${series}: up to date (${current})"
              continue
            fi
            # Only ever move forward. A truncated or stale listing could
            # otherwise open a PR that walks a series backwards.
            newest=$(echo "${current} ${latest}" | tr ' ' '\n' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | tail -1)
            if [[ "${newest}" != "${latest}" ]]; then
              echo "::warning::${series}: upstream ${latest} is older than tracked ${current}, refusing to downgrade"
              continue
            fi

            echo "${series}: ${current} -> ${latest}"
            moved+=("${series} -> ${latest}")
            bullets+=("$(printf -- '- `%s`: `%s` -> [`%s`](https://github.com/devenvy/ffmpeg/releases/tag/%s)' \
              "${series}" "${current}" "${latest}" "${latest}")")

            # shellcheck disable=SC2016
            jq --arg s "$series" --arg v "$latest" '.series[$s] = $v' "${work}" > "${work}.tmp"
            mv "${work}.tmp" "${work}"
          done

          if [[ ${#missing[@]} -ne 0 ]]; then
            printf '::error::No upstream release matched tracked series: %s. Refusing to create a partial update PR.\n' \
              "${missing[*]}"
            exit 1
          fi

          if [[ ${#moved[@]} -eq 0 ]]; then
            echo "All series up to date, nothing to open."
            exit 0
          fi

          if [[ ${#moved[@]} -eq 1 ]]; then
            title="Bump FFmpeg: ${moved[0]}"
          else
            title="Bump ${#moved[@]} FFmpeg series"
          fi

          # Rebuilt from the base branch every run, so the branch never carries
          # a stale merge base. The force-push is what keeps a PR that is
          # already open pointing at the newest set of releases.
          git checkout -B "${BRANCH}" "origin/${BASE_BRANCH}"
          mv "${work}" versions.json
          git add versions.json
          git commit -m "${title}"
          git push --force -u origin "${BRANCH}"

          # Body written to a file rather than passed inline: a multi-line
          # string with a line at column 0 terminates the enclosing YAML
          # block scalar, which silently breaks the whole workflow file.
          {
            printf 'New upstream releases are available for the series below.\n\n'
            printf '%s\n' "${bullets[@]}"
            printf '\nMerging this updates every series listed, in one go. Series not\n'
            printf 'listed are already up to date and are left untouched.\n'
          } > /tmp/pr-body.md

          # The force-push above already retargeted any open PR on this branch,
          # so an existing one only needs its title and body refreshed.
          open_pr=$(gh pr list --base "${BASE_BRANCH}" --head "${BRANCH}" \
            --state open --json number --jq '.[0].number // empty')
          if [[ -n "${open_pr}" ]]; then
            echo "Refreshing PR #${open_pr} already open for ${BRANCH}"
            gh pr edit "${open_pr}" --title "${title}" --body-file /tmp/pr-body.md
          else
            gh pr create \
              --title "${title}" \
              --body-file /tmp/pr-body.md \
              --base "${BASE_BRANCH}" --head "${BRANCH}"
          fi
