name: Check for new FFmpeg releases

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-updates
  cancel-in-progress: true

jobs:
  check:
    name: Detect upstream releases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Upstream publishes several series in parallel and marks only one
      # "latest", so releases/latest is never consulted: it points at whichever
      # series published most recently and would silently abandon the others.
      - name: Open a PR per series that moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          UPSTREAM=$(gh release list --repo devenvy/ffmpeg --limit 100 \
            --json tagName --jq '.[].tagName')

          for series in $(jq -r '.series | keys[]' versions.json); do
            current=$(jq -r --arg s "$series" '.series[$s]' versions.json)

            latest=$(echo "${UPSTREAM}" \
              | grep -E "^${series//./\.}\.[0-9]+\.[0-9]+$" \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 || true)

            if [[ -z "${latest}" || "${latest}" == "${current}" ]]; then
              echo "${series}: up to date (${current})"
              continue
            fi

            echo "${series}: ${current} -> ${latest}"
            branch="auto/ffmpeg-${latest}"

            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              echo "  branch ${branch} already exists, skipping"
              continue
            fi

            git checkout -B "${branch}" origin/${GITHUB_REF_NAME}
            jq --arg s "$series" --arg v "$latest" '.series[$s] = $v' versions.json > versions.tmp
            mv versions.tmp versions.json
            git add versions.json
            git commit -m "Bump FFmpeg ${series} series to ${latest}"
            git push -u origin "${branch}"

            gh pr create \
              --title "Bump FFmpeg ${series} series to ${latest}" \
              --body "Upstream [\`${latest}\`](https://github.com/devenvy/ffmpeg/releases/tag/${latest}) is available (was \`${current}\`).

Merging this runs the release workflow for the \`${series}\` series only. Other tracked series are unaffected." \
              --base "${GITHUB_REF_NAME}" --head "${branch}"

            git checkout "${GITHUB_REF_NAME}"
          done
