name: Check for new FFmpeg releases

on:
  schedule:
    - cron: "0 6 * * 1" # Weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-updates
  cancel-in-progress: true

jobs:
  check:
    name: Detect upstream releases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Upstream publishes several series in parallel and marks only one
      # "latest", so releases/latest is never consulted: it points at whichever
      # series published most recently and would silently abandon the others.
      - name: Open a PR per series that moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          UPSTREAM=$(gh release list --repo devenvy/ffmpeg --limit 100 \
            --json tagName --jq '.[].tagName')

          # shellcheck disable=SC2016  # jq program, not a shell expansion
          for series in $(jq -r '.series | keys[]' versions.json); do
            # shellcheck disable=SC2016
            current=$(jq -r --arg s "$series" '.series[$s]' versions.json)

            # Exact field comparison rather than a regex built by bash pattern
            # substitution: ${series//./\.} does not actually escape the dots,
            # leaving separators as wildcards that can match another series.
            latest=$(echo "${UPSTREAM}" \
              | awk -F. -v s="${series}" 'NF == 4 && $1 "." $2 == s && $0 ~ /^[0-9.]+$/' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n \
              | tail -1 || true)

            if [[ -z "${latest}" ]]; then
              echo "::warning::${series}: no upstream release matched - listing may be truncated"
              continue
            fi
            if [[ "${latest}" == "${current}" ]]; then
              echo "${series}: up to date (${current})"
              continue
            fi
            # Only ever move forward. A truncated or stale listing could
            # otherwise open a PR that walks a series backwards.
            newest=$(echo "${current} ${latest}" | tr ' ' '\n' \
              | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | tail -1)
            if [[ "${newest}" != "${latest}" ]]; then
              echo "::warning::${series}: upstream ${latest} is older than tracked ${current}, refusing to downgrade"
              continue
            fi

            echo "${series}: ${current} -> ${latest}"
            branch="auto/ffmpeg-${latest}"

            open_prs=$(gh pr list --head "${branch}" --state open --json number --jq 'length')
            if [[ "${open_prs}" != "0" ]]; then
              echo "  PR for ${branch} already open, skipping"
              continue
            fi
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
              # A branch with no open PR is left over from a run that pushed and
              # then failed or was cancelled before creating the PR. Reuse it
              # rather than skipping forever.
              echo "  reusing orphaned branch ${branch}"
              git push origin --delete "${branch}" || true
            fi

            git checkout -B "${branch}" "origin/${GITHUB_REF_NAME}"
            jq --arg s "$series" --arg v "$latest" '.series[$s] = $v' versions.json > versions.tmp
            mv versions.tmp versions.json
            git add versions.json
            git commit -m "Bump FFmpeg ${series} series to ${latest}"
            git push -u origin "${branch}"

            # Body written to a file rather than passed inline: a multi-line
            # string with a line at column 0 terminates the enclosing YAML
            # block scalar, which silently breaks the whole workflow file.
            {
              printf 'Upstream [`%s`](https://github.com/devenvy/ffmpeg/releases/tag/%s) is available (was `%s`).\n\n' \
                "${latest}" "${latest}" "${current}"
              printf 'Merging this releases the `%s` series only. Other tracked series are unaffected.\n' \
                "${series}"
            } > /tmp/pr-body.md

            gh pr create \
              --title "Bump FFmpeg ${series} series to ${latest}" \
              --body-file /tmp/pr-body.md \
              --base "${GITHUB_REF_NAME}" --head "${branch}"

            git checkout "${GITHUB_REF_NAME}"
          done
