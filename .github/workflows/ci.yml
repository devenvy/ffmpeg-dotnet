name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Helper library
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build src/DevEnvy.FFmpeg.Binaries/DevEnvy.FFmpeg.Binaries.csproj -c Release
      - run: dotnet format --verify-no-changes src/DevEnvy.FFmpeg.Binaries/DevEnvy.FFmpeg.Binaries.csproj

  lint:
    name: Lint scripts and workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
      - name: Shared-library payload verifier tests
        run: python3 -B scripts/test-native-payload.py
      - name: Apple workload selection tests
        run: bash scripts/test-install-apple-workload.sh

      # A malformed workflow file fails silently: GitHub reports "workflow file
      # issue" with no job, and a scheduled workflow would not surface it until
      # its next cron. actionlint catches the YAML and the Actions-specific
      # mistakes, including the shell scripts embedded in run: blocks.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # zizmor catches the security mistakes: unpinned actions, persisted
      # credentials, untrusted values expanded into run: scripts, excessive
      # permissions.
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false # fail the job on findings instead of uploading SARIF

  # The series come from versions.json, as in smoke-test.yml, so adding or
  # dropping one there changes what CI packs with no edit here.
  resolve:
    name: Resolve series
    runs-on: ubuntu-24.04
    outputs:
      series: ${{ steps.m.outputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: m
        run: echo "series=$(jq -c '.series | keys' versions.json)" >> "$GITHUB_OUTPUT"

  # Packs a real subset on Linux and asserts the package layout. Linux matters:
  # Windows tar cannot create symlinks, so the duplicate-library bug the
  # normalization guards against does not even reproduce there.
  pack:
    name: Pack and verify (${{ matrix.series }})
    needs: resolve
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJson(needs.resolve.outputs.series) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - id: tag
        env:
          SERIES: ${{ matrix.series }}
        run: |
          # shellcheck disable=SC2016  # jq program, not a shell expansion
          echo "tag=$(jq -r --arg s "${SERIES}" '.series[$s]' versions.json)" >> "$GITHUB_OUTPUT"

      # Every RID, for every tracked series. A subset here would leave the
      # series that upstream moved less recently packing platforms nothing
      # had built since, and the release packs all of them for both.
      - name: Pack every RID
        env:
          UPSTREAM_TAG: ${{ steps.tag.outputs.tag }}
        run: CELLS="lgplv2" bash scripts/pack.sh "${UPSTREAM_TAG}" 0.0.0-ci --output ./nupkgs --phase base

      # The v3 cells exercise Windows hard imports and Linux's bundled shared
      # dependencies. The lgplv2 set alone does not select the Vulkan loader,
      # so it cannot catch that library disappearing during normalization.
      - name: Pack v3 Windows and Linux cells for native dependency checks
        env:
          UPSTREAM_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          RIDS="win-x64 linux-x64 linux-musl-x64" CELLS="lgplv3" bash scripts/pack.sh "${UPSTREAM_TAG}" 0.0.0-ci --output ./nupkgs --phase base

      # Linux v3 builds carry native shared dependencies such as the Vulkan loader.
      # Verify the upstream SONAME and bytes, including dependencies beyond libav*.
      - name: Verify shared libraries survive package normalization
        env:
          UPSTREAM_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          for rid in linux-x64 linux-musl-x64; do
            python3 scripts/verify-native-payload.py \
              ".downloads/${UPSTREAM_TAG}/ffmpeg-${UPSTREAM_TAG%.*}-${rid}-lgplv3.tar.gz" \
              "nupkgs/DevEnvy.FFmpeg.Binaries.LGPLv3.Runtime.${rid}.0.0.0-ci.nupkg" "${rid}"
          done

      - name: Pack metas
        env:
          UPSTREAM_TAG: ${{ steps.tag.outputs.tag }}
        run: CELLS="lgplv2" bash scripts/pack.sh "${UPSTREAM_TAG}" 0.0.0-ci --output ./nupkgs --phase meta

      # Complete for the one cell packed in full (lgplv3 above covers the native
      # dependency checks on three representative platforms).
      - name: Verify package contents
        run: bash scripts/verify-packages.sh ./nupkgs --expect-complete --cells LGPLv2

      - name: Verify consumer restore and build
        run: bash scripts/verify-consumer.sh ./nupkgs 0.0.0-ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nupkgs-${{ matrix.series }}
          path: nupkgs/*.nupkg
          retention-days: 7

  # Whether this pull request changes anything the smoke tests cover. They run
  # real apps on every platform (macOS, iOS, Android and Windows runners
  # included), so they run only when something they test changed.
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      smoke: ${{ steps.c.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: c
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Run by hand: always smoke test.
          if [ "${EVENT}" != pull_request ]; then echo "smoke=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # HEAD is the pull request merged into main, so its first parent is main.
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          if grep -qE '^(versions\.json|src/|scripts/|tests/|Directory\.Build\.props|[^/]+\.slnx|\.github/workflows/(ci|smoke-test)\.yml)' changed.txt; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
          fi

  # The smoke tests, as part of CI: their result decides `result`, so a pull
  # request (an FFmpeg bump included, which merges itself) cannot merge while
  # any platform fails. They once ran as a separate workflow that no required
  # check covered, and a bump merged with every iOS and Mac Catalyst job red.
  smoke:
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/smoke-test.yml

  # The single required status check: the branch ruleset requires this job
  # alone, so adding or renaming a job above never needs a ruleset change.
  result:
    if: always()
    needs: [helper, lint, resolve, pack, changes, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All jobs passed
        env:
          HELPER: ${{ needs.helper.result }}
          LINT: ${{ needs.lint.result }}
          RESOLVE: ${{ needs.resolve.result }}
          PACK: ${{ needs.pack.result }}
          CHANGES: ${{ needs.changes.result }}
          SMOKE: ${{ needs.smoke.result }}
          SMOKE_NEEDED: ${{ needs.changes.outputs.smoke }}
        run: |
          for result in "$HELPER" "$LINT" "$RESOLVE" "$PACK" "$CHANGES"; do test "$result" = "success"; done
          # skipped only when nothing the smoke tests cover changed
          if [ "$SMOKE_NEEDED" = "false" ]; then
            test "$SMOKE" = "skipped" || test "$SMOKE" = "success"
          else
            test "$SMOKE" = "success"
          fi

  # Dependabot's PRs merge themselves once the required check passes, as devenvy-bot (org variable
  # DEVENVY_BOT_CLIENT_ID, org secret DEVENVY_BOT_PRIVATE_KEY, both also Dependabot secrets), as in the
  # other devenvy repositories.
  dependabot-auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.DEVENVY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEVENVY_BOT_PRIVATE_KEY }}
          # enabling auto-merge
          permission-contents: write
          permission-pull-requests: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
